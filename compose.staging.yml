name: obserbing-staging

services:
  backend:
    image: "${BACKEND_IMAGE:?Set BACKEND_IMAGE to an immutable image reference}"
    init: true
    restart: unless-stopped
    environment:
      RAILS_ENV: production
      DATABASE_URL: "${DATABASE_URL:?Set the staging Amazon RDS connection URL}"
      RAILS_MASTER_KEY: "${RAILS_MASTER_KEY:?Set the staging Rails master key}"
      RAILS_LOG_TO_STDOUT: "1"
      RAILS_SERVE_STATIC_FILES: "1"
      RAILS_MAX_THREADS: "${RAILS_MAX_THREADS:-3}"
      WEB_CONCURRENCY: "${WEB_CONCURRENCY:-1}"
      JOB_CONCURRENCY: "${JOB_CONCURRENCY:-1}"
    ports:
      - "${RAILS_PORT:-3000}:80"
    healthcheck:
      test: ["CMD-SHELL", "curl --fail --silent http://localhost/up >/dev/null || exit 1"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 30s
    stop_grace_period: 30s
    security_opt:
      - no-new-privileges:true
