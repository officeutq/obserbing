version: 1
random_seed: 20260812

external_api:
  enabled: false
  total_budget_jpy: 5000
  warning_ratio: 0.8
  usd_to_jpy: 150.0
  maximum_comparison_requests: 216
  maximum_repetitions: 3

meaning_providers:
  openai:
    adapter: openai
    provider: openai
    model: gpt-5.6-terra
    api: responses
    endpoint: https://api.openai.com/v1/responses
    api_key_env: OPENAI_API_KEY
    reasoning_effort: low
    max_output_tokens: 1024
    timeout_seconds: 30
    max_retries: 1
    retry_delay_seconds: 0.5
    pricing:
      version: 2026-08-12-standard-short-context
      checked_at: "2026-08-12"
      input_per_million_usd: 2.0
      cached_input_per_million_usd: 0.2
      output_per_million_usd: 12.0
      source: https://developers.openai.com/api/docs/pricing
  anthropic:
    adapter: anthropic
    provider: anthropic
    model: claude-sonnet-5
    api: messages
    endpoint: https://api.anthropic.com/v1/messages
    api_version: "2023-06-01"
    api_key_env: ANTHROPIC_API_KEY
    reasoning_effort: low
    max_output_tokens: 1024
    timeout_seconds: 30
    max_retries: 1
    retry_delay_seconds: 0.5
    pricing:
      version: 2026-08-12-standard
      checked_at: "2026-08-12"
      input_per_million_usd: 2.0
      cached_input_per_million_usd: 0.2
      output_per_million_usd: 10.0
      source: https://platform.claude.com/docs/en/about-claude/pricing

operations:
  safety:
    adapter: fixture
    provider: fixture
    model: offline-safety-v1
    prompt_version: draft-1
    schema_version: draft-1
    timeout_seconds: 3
  meaning:
    adapter: fixture
    provider: fixture
    model: offline-meaning-v1
    prompt_version: draft-1
    schema_version: draft-1
    timeout_seconds: 3
  embedding:
    adapter: fixture
    provider: fixture
    model: offline-hash-embedding-v1
    schema_version: draft-1
    timeout_seconds: 3
  line_evaluation:
    adapter: fixture
    provider: fixture
    model: offline-line-evaluation-v1
    prompt_version: draft-1
    schema_version: draft-1
    timeout_seconds: 3

search:
  candidate_limit: 50
  evaluation_limit: 20

selection:
  minimum_relevance: 0.30
  maximum_directness: 0.75
  minimum_space: 0.45
  minimum_obserbing_fit: 0.60

paths:
  entries: data/entries.yml
  lines: data/lines.yml
  safety_cases: data/safety_cases.yml
  telemetry: tmp/telemetry.jsonl
  results: results
