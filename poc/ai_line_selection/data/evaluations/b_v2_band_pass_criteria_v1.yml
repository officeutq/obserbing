decision_rationale:
  a_min: 0.45は0.40よりtoo-far/unrelatedを抑え、0.50以上で急増した候補0件を避ける
  s_max: 0.55は保存済みProvider Top-1標本でtoo-close 10件を除外する一方、just-right除外を3件に留めた
  top_n: 20は閾値前のanalogical候補回収余地を保ち、閾値後p95 9件へ縮小する
limitations:
  - 保存済みraw-text Provider成果物は各EntryのTop-1だけで、全候補surface cosineを再構成できない
  - character-bigram値とProvider cosine値は相互変換しない
  - #42の10対象へ閾値を過適合させず、36 Entryの旧保存profileを診断入力として使った
  - S_maxの証拠制約は#46の事前固定値を変更せず、ライブ結果の解釈と#48の証拠十分性判定へ引き継ぐ
