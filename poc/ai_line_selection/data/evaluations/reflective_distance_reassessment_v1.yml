  - pair_id: E005/L117
    display_ids:
    - A-E005-R2
    entry_text: |-
      予定が一つ変わっただけなのに、その先も全部ずれる気がする。

      実際にはまだ何も起きていない。
    line_text: 湯気が消えるまでの時間にも、一日は流れている。
    provisional_acceptable: true
    provisional_distance: just_right
    provisional_relation_type: analogical_transfer
    reason: 未来へ注意が偏る間も現在が進むことを湯気を待つ短い時間へ転写できる
  - pair_id: E008/L021
    display_ids:
