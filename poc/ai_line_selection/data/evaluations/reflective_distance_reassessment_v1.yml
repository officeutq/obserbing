    entry_text: |-
      相手の話を聞いていたつもりだった。
      帰ってから、自分が話す番を待っていただけだったかもしれないと思った。
    line_text: 会話のあとに残る声は、話した人のものだけではない。
    provisional_acceptable: false
    provisional_distance: too_far
    provisional_relation_type: weak_connection
    reason: 聞くより話す番を待っていた自己認識と会話後に残る複数の声の対応が曖昧である
  - pair_id: E013/L012
    display_ids:
    - A-E013-R2
    entry_text: 今日はずっと忙しかったのに、何を進めたのか説明しようとすると言葉がない。
    line_text: わからなさは、空白ではなく形の途中かもしれない。
    provisional_acceptable: true
    provisional_distance: just_right
    provisional_relation_type: analogical_transfer
    reason: 説明できない進捗を空白ではなく形成途中と見る接続は可能だが複数の読みが残る
  - pair_id: E019/L074
    display_ids:
    - A-E019-R2
    entry_text: 部屋の配置を変えたら、前より使いやすいのに自分の部屋ではないみたいだ。
    line_text: 空になった場所は、前より広く見える。
    provisional_acceptable: true
    provisional_distance: just_right
    provisional_relation_type: same_domain
    reason: 空間の変更が広さや自分の場所という知覚を変える接続はあるが空になることはEntryにない
  - pair_id: E023/L118
    display_ids:
    - A-E023-R1
    entry_text: |-
      もう使わない場所の写真を消した。
      容量はほとんど変わらなかった。
      消したという事実だけが少し大きい。
    line_text: 同じ景色を通るたび、同じではないものが増える。
    provisional_acceptable: false
    provisional_distance: too_far
    provisional_relation_type: weak_connection
