name: obserbing

services:
  backend:
    build:
      context: ./backend
      target: development
    command: ["./bin/rails", "server", "-b", "0.0.0.0"]
    environment:
      DB_HOST: db
      DB_PORT: 5432
      POSTGRES_DB: ${POSTGRES_DB:-obserbing_development}
      POSTGRES_TEST_DB: ${POSTGRES_TEST_DB:-obserbing_test}
      POSTGRES_USER: ${POSTGRES_USER:-obserbing}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?Copy .env.example to .env and set POSTGRES_PASSWORD}
      RAILS_ENV: development
      RAILS_MAX_THREADS: ${RAILS_MAX_THREADS:-5}
    depends_on:
      db:
        condition: service_healthy
    ports:
      - "${RAILS_PORT:-3000}:3000"
    volumes:
      - ./backend:/rails
      - bundle_data:/usr/local/bundle

  db:
    image: pgvector/pgvector:0.8.1-pg18-bookworm
    environment:
      POSTGRES_DB: ${POSTGRES_INIT_DB:-postgres}
      POSTGRES_USER: ${POSTGRES_USER:-obserbing}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?Copy .env.example to .env and set POSTGRES_PASSWORD}
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $${POSTGRES_USER} -d $${POSTGRES_DB}"]
      interval: 5s
      timeout: 5s
      retries: 10
    ports:
      - "${POSTGRES_PORT:-5432}:5432"
    volumes:
      - postgres_data:/var/lib/postgresql

volumes:
  bundle_data:
  postgres_data:
